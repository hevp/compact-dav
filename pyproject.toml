[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "compact-dav"
version = "2.0"
description = "A compact OwnCloud/NextCloud WebDAV client"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "faust-cchardet>=2.1",
    "lxml>=6.1",
    "python-dateutil>=2.9",
    "requests>=2.34",
    "simplejson>=4.2",
    "urllib3>=2.8",
]

[project.scripts]
dav = "compact_dav._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
compact_dav = ["data/*.json"]
